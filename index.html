<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Chute CV-201 - Inspeccion</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; font-family: -apple-system, Arial, sans-serif; background:#f1efe8; }
  #canvas-container { width:100%; height:100%; touch-action:none; }
  #ui {
    position:fixed; top:12px; left:12px; z-index:10;
    background:rgba(255,255,255,0.94); border-radius:10px; padding:12px 16px;
    box-shadow:0 2px 8px rgba(0,0,0,0.12); max-width:290px;
  }
  #ui h3 { margin:0 0 10px; font-size:14px; font-weight:600; color:#2C2C2A; }
  #category-toggle { display:flex; gap:6px; margin-bottom:12px; }
  .cat-btn {
    flex:1; padding:7px 4px; font-size:12px; border-radius:6px; border:1px solid #ccc;
    background:#fff; cursor:pointer; color:#555; text-align:center;
  }
  .cat-btn.active { background:#2C2C2A; color:#fff; border-color:#2C2C2A; }
  .legend-item { display:flex; align-items:center; gap:8px; font-size:12px; color:#444; margin:4px 0; }
  .swatch { width:12px; height:12px; border-radius:3px; flex-shrink:0; border:1px solid rgba(0,0,0,0.15); }
  #counts { margin-top:10px; padding-top:10px; border-top:1px solid #ddd; font-size:12px; color:#555; }
  #counts div { display:flex; justify-content:space-between; margin:2px 0; }
  #selected-info {
    position:fixed; top:12px; right:12px; z-index:10;
    background:rgba(255,255,255,0.94); border-radius:10px; padding:12px 16px;
    box-shadow:0 2px 8px rgba(0,0,0,0.12); font-size:13px; color:#2C2C2A;
    min-width:200px; display:none;
  }
  #selected-info strong { display:block; margin-bottom:6px; font-size:14px; }
  #loading {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    font-size:14px; color:#888; z-index:20;
  }
  #btn-reset, #btn-save { margin-top:8px; width:100%; padding:8px; border-radius:6px; border:1px solid #ccc; background:#fff; cursor:pointer; font-size:12px; }
  #btn-save { background:#2C2C2A; color:#fff; border-color:#2C2C2A; font-weight:600; }
  #btn-save:disabled { background:#ccc; border-color:#ccc; cursor:default; }
  #save-status { font-size:11px; color:#888; margin-top:6px; text-align:center; min-height:14px; }
  #turno-input { width:100%; padding:6px; font-size:12px; border-radius:6px; border:1px solid #ccc; margin-top:8px; box-sizing:border-box; }
  #turno-label { font-size:11px; color:#888; margin-top:8px; display:block; }
  .type-label {
    position:absolute; z-index:15; pointer-events:none;
    background:rgba(255,255,255,0.95); color:#2C2C2A; font-size:11px; font-weight:600; padding:4px 8px;
    border-radius:5px; white-space:nowrap; transform:translate(-50%, -50%);
    border:1px solid #2C2C2A; box-shadow:0 1px 4px rgba(0,0,0,0.15);
  }
</style>
</head>
<body>
<div id="canvas-container"></div>
<div id="ui">
  <h3>Chute CV-201</h3>
  <div id="category-toggle">
    <div class="cat-btn" id="btn-cat-estructura">Estructura</div>
    <div class="cat-btn active" id="btn-cat-placas">Placas guia</div>
  </div>
  <div id="legend"></div>
  <div id="counts"></div>
  <label id="turno-label">Turno</label>
  <select id="turno-input"></select>
  <label id="gap-label" style="font-size:11px; color:#888; margin-top:8px; display:block;">G.A.P. placa guia - correa (opcional)</label>
  <input id="gap-input" type="text" placeholder='Ej: 3 mm o 1/8"' style="width:100%; padding:6px; font-size:12px; border-radius:6px; border:1px solid #ccc; box-sizing:border-box;">
  <button id="btn-save">Guardar cambios</button>
  <div id="save-status"></div>
  <button id="btn-pdf" style="margin-top:8px; width:100%; padding:8px; border-radius:6px; border:1px solid #ccc; background:#fff; cursor:pointer; font-size:12px;">Exportar informe PDF</button>
  <button id="btn-reset">Restablecer vista</button>
</div>
<div id="selected-info">
  <strong id="sel-name">-</strong>
  <div id="sel-state">-</div>
</div>
<div id="loading">Cargando modelo 3D...</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getDatabase, ref, update, onValue, get } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAT0v3K_kG8btaVrBB2JkyOIhhj_bnlEOI",
    authDomain: "chute-alimentacion.firebaseapp.com",
    databaseURL: "https://chute-alimentacion-default-rtdb.firebaseio.com",
    projectId: "chute-alimentacion",
    storageBucket: "chute-alimentacion.firebasestorage.app",
    messagingSenderId: "572646669749",
    appId: "1:572646669749:web:f4f75a847b56069a466dfc"
  };
  const fbApp = initializeApp(firebaseConfig);
  const db = getDatabase(fbApp);

  window.__fb = { ref, update, onValue, get, db };
</script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
window.addEventListener('DOMContentLoaded', function () {
  var waitForFirebase = setInterval(function () {
    if (window.__fb) {
      clearInterval(waitForFirebase);
      startApp();
    }
  }, 50);
});

function startApp() {
  var fb = window.__fb;
  var COLOR_STEEL = 0x8B95A1;
  var COLOR_LIGHTGRAY = 0xD9D7CF;
  var COLOR_GREEN = 0x639922;
  var COLOR_RED = 0xE24B4A;
  var COLOR_YELLOW = 0xFAC775;
  var DIM_OPACITY = 0.2;

  var CATEGORIES = {
    estructura: {
      label: "Estructura",
      prefix: "Pm-",
      baseColor: COLOR_STEEL,
      states: [
        { name: "No inspeccionado", color: COLOR_STEEL },
        { name: "Cambio", color: COLOR_GREEN },
        { name: "Proximo a cambio", color: COLOR_YELLOW }
      ]
    },
    placas: {
      label: "Placas guia",
      prefix: "Pg-",
      baseColor: COLOR_LIGHTGRAY,
      states: [
        { name: "No inspeccionado", color: COLOR_LIGHTGRAY },
        { name: "Cambio", color: COLOR_GREEN },
        { name: "Volteo", color: COLOR_RED },
        { name: "Proxima mantencion", color: COLOR_YELLOW }
      ]
    }
  };

  var activeCategory = "placas";
  var meshStates = {};
  var dirtyKeys = {};
  var modelBox = null;

  var container = document.getElementById('canvas-container');
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf1efe8);

  var camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 1, 50000);
  camera.position.set(4000, 3000, 4000);

  var renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.localClippingEnabled = true;
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  var dirLight = new THREE.DirectionalLight(0xffffff, 0.55);
  dirLight.position.set(1, 1, 1);
  scene.add(dirLight);
  var dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
  dirLight2.position.set(-1, -0.5, -1);
  scene.add(dirLight2);

  var target = new THREE.Vector3(0,0,0);
  var isDragging = false, prevX = 0, prevY = 0;
  var spherical = new THREE.Spherical();
  var offset = new THREE.Vector3();
  var minRadius = 1, maxRadius = 100000;
  var defaultSpherical = { theta: Math.PI/4, phi: Math.PI/3, radius: 1000 };

  function updateCameraFromSpherical() {
    offset.setFromSpherical(spherical);
    camera.position.copy(target).add(offset);
    camera.lookAt(target);
  }

  renderer.domElement.addEventListener('mousedown', function(e) {
    isDragging = true; prevX = e.clientX; prevY = e.clientY;
  });
  window.addEventListener('mouseup', function() { isDragging = false; });
  window.addEventListener('mousemove', function(e) {
    if (!isDragging) return;
    var dx = e.clientX - prevX, dy = e.clientY - prevY;
    prevX = e.clientX; prevY = e.clientY;
    spherical.theta -= dx * 0.005;
    spherical.phi -= dy * 0.005;
    spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi));
    updateCameraFromSpherical();
  });
  renderer.domElement.addEventListener('wheel', function(e) {
    e.preventDefault();
    spherical.radius *= (e.deltaY > 0) ? 1.1 : 0.9;
    spherical.radius = Math.max(minRadius, Math.min(maxRadius, spherical.radius));
    updateCameraFromSpherical();
  }, { passive: false });

  // --- Soporte tactil (moviles/tablet): un dedo rota, dos dedos hacen zoom ---
  var touchPrevDist = null;
  function touchDist(t0, t1) {
    var dx = t0.clientX - t1.clientX, dy = t0.clientY - t1.clientY;
    return Math.sqrt(dx*dx + dy*dy);
  }
  renderer.domElement.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) {
      isDragging = true;
      prevX = e.touches[0].clientX;
      prevY = e.touches[0].clientY;
    } else if (e.touches.length === 2) {
      isDragging = false;
      touchPrevDist = touchDist(e.touches[0], e.touches[1]);
    }
  }, { passive: true });
  renderer.domElement.addEventListener('touchmove', function(e) {
    e.preventDefault();
    if (e.touches.length === 1 && isDragging) {
      var dx = e.touches[0].clientX - prevX, dy = e.touches[0].clientY - prevY;
      prevX = e.touches[0].clientX; prevY = e.touches[0].clientY;
      spherical.theta -= dx * 0.0025;
      spherical.phi -= dy * 0.0025;
      spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi));
      updateCameraFromSpherical();
    } else if (e.touches.length === 2 && touchPrevDist !== null) {
      var d = touchDist(e.touches[0], e.touches[1]);
      var scale = touchPrevDist / d;
      touchPrevDist = d;
      spherical.radius *= scale;
      spherical.radius = Math.max(minRadius, Math.min(maxRadius, spherical.radius));
      updateCameraFromSpherical();
    }
  }, { passive: false });
  renderer.domElement.addEventListener('touchend', function(e) {
    if (e.touches.length === 0) { isDragging = false; touchPrevDist = null; }
    else if (e.touches.length === 1) { touchPrevDist = null; isDragging = true; prevX = e.touches[0].clientX; prevY = e.touches[0].clientY; }
  }, { passive: true });

  var loader = new THREE.GLTFLoader();
  var raycaster = new THREE.Raycaster();
  var mouse = new THREE.Vector2();
  var typeLabelMeshes = []; // {mesh, text}

  function renderLegend() {
    var cat = CATEGORIES[activeCategory];
    var html = '';
    cat.states.forEach(function(s) {
      html += '<div class="legend-item"><span class="swatch" style="background:#' + s.color.toString(16).padStart(6,'0') + '"></span>' + s.name + '</div>';
    });
    document.getElementById('legend').innerHTML = html;
  }

  function renderCounts() {
    var cat = CATEGORIES[activeCategory];
    var counts = cat.states.map(function() { return 0; });
    var total = 0;
    Object.keys(meshStates).forEach(function(k) {
      var e = meshStates[k];
      if (e.category === activeCategory) {
        counts[e.state]++;
        total++;
      }
    });
    var html = '<div><span>Total</span><strong>' + total + '</strong></div>';
    cat.states.forEach(function(s, i) {
      html += '<div><span>' + s.name + '</span><strong>' + counts[i] + '</strong></div>';
    });
    document.getElementById('counts').innerHTML = html;
  }

  function applyCategoryVisuals() {
    Object.keys(meshStates).forEach(function(k) {
      var e = meshStates[k];
      var isActive = (e.category === activeCategory);
      var stateDef = CATEGORIES[e.category].states[e.state];
      e.mesh.material.color.setHex(stateDef.color);
      if (isActive) {
        e.mesh.material.transparent = false;
        e.mesh.material.opacity = 1;
      } else {
        e.mesh.material.transparent = true;
        e.mesh.material.opacity = DIM_OPACITY;
      }
    });
    updateTypeLabelsVisibility();
    renderLegend();
    renderCounts();
    document.getElementById('selected-info').style.display = 'none';
  }

  function setCategory(cat) {
    activeCategory = cat;
    document.getElementById('btn-cat-estructura').classList.toggle('active', cat === 'estructura');
    document.getElementById('btn-cat-placas').classList.toggle('active', cat === 'placas');
    applyCategoryVisuals();
  }

  document.getElementById('btn-cat-estructura').addEventListener('click', function() { setCategory('estructura'); });
  document.getElementById('btn-cat-placas').addEventListener('click', function() { setCategory('placas'); });

  // --- Etiquetas de tipo (una por tipo, con cantidad) ---
  var typeLabelSvg = null;

  function buildTypeLabels() {
    var seen = {};
    Object.keys(meshStates).forEach(function(k) {
      var entry = meshStates[k];
      var m = entry.label.match(/^(Pg)-(izq|der)-(.+)-(\d+)$/);
      var typeKey, code;
      if (m) { typeKey = m[1] + '-' + m[2] + '-' + m[3]; code = m[3] + (m[2] === 'izq' ? ' izq.' : ' der.'); }
      else { typeKey = entry.label; code = entry.label; }
      if (!seen[typeKey]) seen[typeKey] = { count: 0, sample: entry, code: code };
      seen[typeKey].count++;
    });

    typeLabelSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    typeLabelSvg.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; z-index:14; pointer-events:none;';
    document.body.appendChild(typeLabelSvg);

    typeLabelMeshes = [];
    var offsets = [ [70,-70], [-70,-70], [70,70], [-70,70], [95,-30], [-95,-30], [95,30], [-95,30] ];
    var i = 0;
    Object.keys(seen).forEach(function(tk) {
      var info = seen[tk];
      var div = document.createElement('div');
      div.className = 'type-label';
      div.textContent = info.code + ' (x' + info.count + ')';
      document.body.appendChild(div);
      var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('stroke', '#2C2C2A');
      line.setAttribute('stroke-width', '1.3');
      typeLabelSvg.appendChild(line);
      var dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      dot.setAttribute('r', '3');
      dot.setAttribute('fill', '#2C2C2A');
      typeLabelSvg.appendChild(dot);
      typeLabelMeshes.push({
        mesh: info.sample.mesh, category: info.sample.category,
        el: div, line: line, dot: dot,
        offset: offsets[i % offsets.length]
      });
      i++;
    });
  }

  function updateTypeLabelsVisibility() {
    typeLabelMeshes.forEach(function(t) {
      var visible = (t.category === activeCategory);
      t.el.style.display = visible ? 'block' : 'none';
      t.line.style.display = visible ? 'block' : 'none';
      t.dot.style.display = visible ? 'block' : 'none';
    });
  }

  function updateTypeLabelPositions() {
    var w = window.innerWidth, h = window.innerHeight;
    typeLabelMeshes.forEach(function(t) {
      if (t.el.style.display === 'none') return;
      var pos = new THREE.Vector3();
      t.mesh.getWorldPosition(pos);
      pos.project(camera);
      if (pos.z > 1) {
        t.el.style.display = 'none'; t.line.style.display = 'none'; t.dot.style.display = 'none';
        return;
      }
      var x = (pos.x * 0.5 + 0.5) * w;
      var y = (-pos.y * 0.5 + 0.5) * h;
      var lx = x + t.offset[0];
      var ly = y + t.offset[1];
      t.el.style.left = lx + 'px';
      t.el.style.top = ly + 'px';
      t.line.setAttribute('x1', x); t.line.setAttribute('y1', y);
      t.line.setAttribute('x2', lx); t.line.setAttribute('y2', ly);
      t.dot.setAttribute('cx', x); t.dot.setAttribute('cy', y);
    });
  }

  // --- Flecha de direccion de flujo ---
  var flowMarkers = [];
  var entryMarkers = [];
  var flowDir = new THREE.Vector3();
  var flowStart = new THREE.Vector3();
  var flowLength = 1;
  var entryStart = new THREE.Vector3();
  var entryLength = 1;

  function makeFlatArrowGeometry() {
    var shape = new THREE.Shape();
    shape.moveTo(0, 0.5);
    shape.lineTo(1, 0);
    shape.lineTo(0, -0.5);
    shape.quadraticCurveTo(0.25, 0, 0, 0.5);
    return new THREE.ShapeGeometry(shape);
  }

  function addFlowArrow(box) {
    var size = box.getSize(new THREE.Vector3());
    var longAxis = size.x >= size.z ? 'x' : 'z';
    flowLength = (longAxis === 'x' ? size.x : size.z) * 0.9;
    flowDir.copy(longAxis === 'x' ? new THREE.Vector3(1,0,0) : new THREE.Vector3(0,0,1));
    flowStart.copy(box.getCenter(new THREE.Vector3()));
    flowStart.y = box.min.y + size.y * 0.55;
    if (longAxis === 'x') flowStart.x = box.min.x + size.x * 0.05; else flowStart.z = box.min.z + size.z * 0.05;

    var markerLen = flowLength * 0.05;
    var n = 6;
    for (var i = 0; i < n; i++) {
      var geo = makeFlatArrowGeometry();
      geo.rotateX(-Math.PI / 2);
      if (longAxis === 'z') geo.rotateY(Math.PI / 2);
      geo.scale(markerLen, markerLen, markerLen);
      var mat = new THREE.MeshBasicMaterial({ color: 0x639922, side: THREE.DoubleSide });
      var mesh = new THREE.Mesh(geo, mat);
      mesh.userData.offset = i / n;
      scene.add(mesh);
      flowMarkers.push(mesh);
    }
  }

  function addEntryArrow(box) {
    var size = box.getSize(new THREE.Vector3());
    entryLength = size.y * 1.1;
    entryStart.copy(box.getCenter(new THREE.Vector3()));
    entryStart.y = box.max.y + entryLength;
    var longAxis = size.x >= size.z ? 'x' : 'z';
    if (longAxis === 'x') entryStart.x = box.min.x + size.x * 0.18; else entryStart.z = box.min.z + size.z * 0.18;

    var markerLen = flowLength * 0.05;
    var n = 4;
    for (var i = 0; i < n; i++) {
      var geo = makeFlatArrowGeometry();
      geo.rotateZ(-Math.PI / 2);
      geo.scale(markerLen, markerLen, markerLen);
      var mat = new THREE.MeshBasicMaterial({ color: 0x639922, side: THREE.DoubleSide });
      var mesh = new THREE.Mesh(geo, mat);
      mesh.userData.offset = i / n;
      scene.add(mesh);
      entryMarkers.push(mesh);
    }
  }

  function updateFlowMarkers(t) {
    var speed = 0.15;
    flowMarkers.forEach(function(m) {
      var p = (t * speed + m.userData.offset) % 1;
      m.position.copy(flowStart).addScaledVector(flowDir, p * flowLength);
      var fade = Math.min(p * 6, (1 - p) * 6, 1);
      m.material.opacity = 0.35 + fade * 0.65;
      m.material.transparent = true;
    });
    entryMarkers.forEach(function(m) {
      var p = (t * speed + m.userData.offset) % 1;
      m.position.copy(entryStart);
      m.position.y = entryStart.y - p * entryLength;
      var fade = Math.min(p * 6, (1 - p) * 6, 1);
      m.material.opacity = 0.35 + fade * 0.65;
      m.material.transparent = true;
    });
  }

  fb.get(fb.ref(fb.db, 'estados')).then(function(snapshot) {
    var saved = snapshot.exists() ? snapshot.val() : {};

    loader.load('./chute.glb', function(gltf) {
      var model = gltf.scene;
      scene.add(model);

      var box = new THREE.Box3().setFromObject(model);
      modelBox = box;
      var center = box.getCenter(new THREE.Vector3());
      var size = box.getSize(new THREE.Vector3()).length();
      target.copy(center);
      defaultSpherical.radius = size * 1.2;
      spherical.theta = defaultSpherical.theta;
      spherical.phi = defaultSpherical.phi;
      spherical.radius = defaultSpherical.radius;
      minRadius = size * 0.05;
      maxRadius = size * 5;
      camera.near = size / 1000;
      camera.far = size * 100;
      camera.updateProjectionMatrix();
      updateCameraFromSpherical();
      addFlowArrow(box);
      addEntryArrow(box);

      model.traverse(function(child) {
        if (child.isMesh) {
          var name = child.name.replace(/-1$/, '');
          var category = null;
          if (name.indexOf(CATEGORIES.placas.prefix) === 0) category = 'placas';
          else if (name.indexOf(CATEGORIES.estructura.prefix) === 0) category = 'estructura';
          if (!category) return;
          child.material = child.material.clone();
          child.material.side = THREE.DoubleSide;

          var edges = new THREE.LineSegments(
            new THREE.EdgesGeometry(child.geometry, 20),
            new THREE.LineBasicMaterial({ color: 0x3a3a3a })
          );
          child.add(edges);

          var savedState = (saved[child.name] && typeof saved[child.name].state === 'number') ? saved[child.name].state : 0;
          meshStates[child.name] = { mesh: child, state: savedState, label: name, category: category };
        }
      });

      buildTypeLabels();
      document.getElementById('loading').style.display = 'none';
      applyCategoryVisuals();
      animate();

      fb.onValue(fb.ref(fb.db, 'estados'), function(snap) {
        var data = snap.val() || {};
        var changed = false;
        Object.keys(data).forEach(function(k) {
          if (meshStates[k] && !dirtyKeys[k] && typeof data[k].state === 'number' && data[k].state !== meshStates[k].state) {
            meshStates[k].state = data[k].state;
            changed = true;
          }
        });
        if (changed) applyCategoryVisuals();
      });
    }, undefined, function(err) {
      console.error('Error completo cargando chute.glb:', err);
      var msg = (err && err.message) ? err.message : (err && err.target && err.target.status ? ('HTTP ' + err.target.status) : JSON.stringify(err));
      document.getElementById('loading').textContent = 'Error cargando el modelo: ' + msg;
    });
  }).catch(function(err) {
    document.getElementById('loading').textContent = 'Error conectando a Firebase: ' + err.message;
  });

  renderer.domElement.addEventListener('click', function(e) {
    var rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    var activeMeshes = Object.keys(meshStates)
      .filter(function(k) { return meshStates[k].category === activeCategory; })
      .map(function(k) { return meshStates[k].mesh; });
    var intersects = raycaster.intersectObjects(activeMeshes, false);
    if (intersects.length > 0) {
      var picked = intersects[0].object;
      var entry = meshStates[picked.name];
      var cat = CATEGORIES[entry.category];
      entry.state = (entry.state + 1) % cat.states.length;
      picked.material.color.setHex(cat.states[entry.state].color);
      dirtyKeys[picked.name] = true;
      renderCounts();
      updateSaveButton();

      var info = document.getElementById('selected-info');
      info.style.display = 'block';
      document.getElementById('sel-name').textContent = entry.label;
      document.getElementById('sel-state').textContent = cat.states[entry.state].name;
    }
  });

  function updateSaveButton() {
    var n = Object.keys(dirtyKeys).length;
    var btn = document.getElementById('btn-save');
    btn.textContent = n > 0 ? ('Guardar cambios (' + n + ')') : 'Guardar cambios';
    btn.disabled = (n === 0);
  }
  updateSaveButton();

  document.getElementById('btn-save').addEventListener('click', function() {
    var keys = Object.keys(dirtyKeys);
    if (keys.length === 0) return;
    var turnoIdx = parseInt(turnoSelect.value, 10);
    var turno = turnoLabels[turnoIdx];
    var payload = {};
    keys.forEach(function(k) {
      var e = meshStates[k];
      payload[k] = { state: e.state, category: e.category, turno: turno, turnoIdx: turnoIdx, ts: Date.now() };
    });
    var statusEl = document.getElementById('save-status');
    statusEl.textContent = 'Guardando...';
    fb.update(fb.ref(fb.db, 'estados'), payload).then(function() {
      dirtyKeys = {};
      updateSaveButton();
      statusEl.textContent = 'Guardado ' + new Date().toLocaleTimeString();
    }).catch(function(err) {
      statusEl.textContent = 'Error al guardar: ' + err.message;
    });
  });

  var urlParams = new URLSearchParams(window.location.search);
  var turnoLabels = [];
  try {
    var turnosParam = urlParams.get('turnos');
    if (turnosParam) turnoLabels = JSON.parse(decodeURIComponent(turnosParam));
  } catch (e) { turnoLabels = []; }
  if (turnoLabels.length === 0) turnoLabels = ['Sin turno definido'];
  var turnoActualIdx = parseInt(urlParams.get('turnoActual'), 10);
  if (isNaN(turnoActualIdx) || turnoActualIdx < 0 || turnoActualIdx >= turnoLabels.length) turnoActualIdx = turnoLabels.length - 1;

  var turnoSelect = document.getElementById('turno-input');
  turnoSelect.innerHTML = turnoLabels.map(function(lbl, i) {
    return '<option value="' + i + '"' + (i === turnoActualIdx ? ' selected' : '') + '>' + lbl + '</option>';
  }).join('');

  var gapInput = document.getElementById('gap-input');
  var savedGap = localStorage.getItem('chute_gap');
  if (savedGap) gapInput.value = savedGap;
  gapInput.addEventListener('change', function() { localStorage.setItem('chute_gap', gapInput.value); });

  var clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    updateTypeLabelPositions();
    updateFlowMarkers(clock.getElapsedTime());
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', function() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  document.getElementById('btn-pdf').addEventListener('click', function() {
    generatePdfReport();
  });

  // --- Captura de vistas del modelo para el informe ---
  function captureAtAspect(aspect, renderFn) {
    var targetW = 1400;
    var targetH = Math.round(targetW / aspect);
    var oldW = renderer.domElement.width, oldH = renderer.domElement.height;
    var oldCamAspect = camera.aspect;
    renderer.setSize(targetW, targetH, false);
    camera.aspect = aspect;
    camera.updateProjectionMatrix();
    var dataUrl = renderFn();
    renderer.setSize(oldW, oldH, false);
    camera.aspect = oldCamAspect;
    camera.updateProjectionMatrix();
    return { dataUrl: dataUrl, aspect: aspect };
  }

  function snapshotView(theta, phi, radiusMul, highlightFn, clipPlanes, aspect) {
    var savedOpacity = {}, savedTransparent = {};
    Object.keys(meshStates).forEach(function(k) {
      var e = meshStates[k];
      savedOpacity[k] = e.mesh.material.opacity;
      savedTransparent[k] = e.mesh.material.transparent;
      var show = highlightFn(e);
      e.mesh.material.transparent = true;
      e.mesh.material.opacity = show ? 1 : 0.05;
    });
    var savedTheta = spherical.theta, savedPhi = spherical.phi, savedRadius = spherical.radius;
    spherical.theta = theta;
    spherical.phi = phi;
    spherical.radius = defaultSpherical.radius * radiusMul;
    updateCameraFromSpherical();

    var result = captureAtAspect(aspect || 1.6, function() {
      renderer.clippingPlanes = clipPlanes || [];
      renderer.render(scene, camera);
      var url = renderer.domElement.toDataURL('image/png');
      renderer.clippingPlanes = [];
      return url;
    });

    Object.keys(meshStates).forEach(function(k) {
      var e = meshStates[k];
      e.mesh.material.opacity = savedOpacity[k];
      e.mesh.material.transparent = savedTransparent[k];
    });
    spherical.theta = savedTheta; spherical.phi = savedPhi; spherical.radius = savedRadius;
    updateCameraFromSpherical();
    renderer.render(scene, camera);
    return result;
  }

  function isIzq(e) { return e.label.indexOf('izq') !== -1; }
  function isDer(e) { return e.label.indexOf('der') !== -1; }
  function isCentral(e) { return e.label.indexOf('sup') !== -1 || e.label.indexOf('ant') !== -1; }

  // --- Vista ortogonal "de frente" de una pared, cortando el modelo por el centro ---
  // sideSign: +1 = lado derecho segun el sentido de carga, -1 = lado izquierdo
  function snapshotWallElevation(category, sideSign) {
    if (!modelBox) return { dataUrl: null, aspect: 2 };
    var up = new THREE.Vector3(0, 1, 0);
    var rightVec = new THREE.Vector3().crossVectors(flowDir, up).normalize();
    var center = modelBox.getCenter(new THREE.Vector3());
    var size = modelBox.getSize(new THREE.Vector3());

    var planeConst = -sideSign * rightVec.dot(center);
    var clipPlane = new THREE.Plane(rightVec.clone().multiplyScalar(sideSign), planeConst);

    var lengthAlongFlow = Math.abs(flowDir.x) > 0.5 ? size.x : size.z;
    var halfW = lengthAlongFlow * 0.55;
    var halfH = size.y * 1.3;
    var aspect = (halfW * 2) / (halfH * 2);
    var orthoCam = new THREE.OrthographicCamera(-halfW, halfW, halfH, -halfH, 0.01, 100000);

    var camDist = (Math.abs(flowDir.x) > 0.5 ? size.z : size.x) * 3 + 2;
    var camPos = center.clone().addScaledVector(rightVec, -sideSign * camDist);
    orthoCam.position.copy(camPos);
    orthoCam.up.copy(up);
    orthoCam.lookAt(center);
    orthoCam.updateProjectionMatrix();

    var savedOpacity = {}, savedTransparent = {};
    Object.keys(meshStates).forEach(function(k) {
      var e = meshStates[k];
      savedOpacity[k] = e.mesh.material.opacity;
      savedTransparent[k] = e.mesh.material.transparent;
      var show = e.category === category && e.state !== 0;
      e.mesh.material.transparent = true;
      e.mesh.material.opacity = show ? 1 : 0.05;
    });

    var oldW = renderer.domElement.width, oldH = renderer.domElement.height;
    var targetW = 1400, targetH = Math.round(targetW / aspect);
    renderer.setSize(targetW, targetH, false);
    renderer.clippingPlanes = [clipPlane];
    renderer.render(scene, orthoCam);
    var dataUrl = renderer.domElement.toDataURL('image/png');
    renderer.clippingPlanes = [];
    renderer.setSize(oldW, oldH, false);

    Object.keys(meshStates).forEach(function(k) {
      var e = meshStates[k];
      e.mesh.material.opacity = savedOpacity[k];
      e.mesh.material.transparent = savedTransparent[k];
    });
    renderer.render(scene, camera);
    return { dataUrl: dataUrl, aspect: aspect };
  }

  function generatePdfReport() {
    var jsPDFCtor = window.jspdf ? window.jspdf.jsPDF : null;
    if (!jsPDFCtor) { alert('No se pudo cargar el generador de PDF. Revisa tu conexion a internet.'); return; }

    var statusEl = document.getElementById('save-status');
    statusEl.textContent = 'Generando informe, un momento...';

    var turnoIdx = parseInt(turnoSelect.value, 10);
    var turnoTxt = turnoLabels[turnoIdx];
    var gapVal = gapInput.value || 'No especificado';

    // --- Colores del tema (mismos que la app) ---
    var C_DARK = [44, 44, 42];
    var C_STEEL = [139, 149, 161];
    var C_GREEN = [99, 153, 34];
    var C_RED = [226, 75, 74];
    var C_YELLOW = [250, 199, 117];
    var C_LINE = [225, 223, 216];
    var C_BG = [246, 245, 241];

    function countsFor(category, sideFilterFn) {
      var counts = {};
      CATEGORIES[category].states.forEach(function(s) { counts[s.name] = 0; });
      Object.keys(meshStates).forEach(function(k) {
        var e = meshStates[k];
        if (e.category === category && sideFilterFn(e)) counts[CATEGORIES[category].states[e.state].name]++;
      });
      return counts;
    }

    var countsPlacas = countsFor('placas', function() { return true; });
    var countsEstructura = countsFor('estructura', function() { return true; });
    var countsPlacasIzq = countsFor('placas', isIzq);
    var countsPlacasDer = countsFor('placas', isDer);
    var countsEstructIzq = countsFor('estructura', isIzq);
    var countsEstructDer = countsFor('estructura', isDer);
    var countsEstructCentral = countsFor('estructura', isCentral);

    // --- Franja central de estructura (clip 3D, isometrico) ---
    var centerZ = modelBox ? (modelBox.min.z + modelBox.max.z) / 2 : 0;
    var band = modelBox ? (modelBox.max.z - modelBox.min.z) * 0.18 : 0.2;
    var clipKeepCentral = [
      new THREE.Plane(new THREE.Vector3(0,0,-1), centerZ + band),
      new THREE.Plane(new THREE.Vector3(0,0,1), -(centerZ - band))
    ];

    // --- Capturas (todas devuelven {dataUrl, aspect}, sin distorsion) ---
    var imgPlacasIzq = snapshotWallElevation('placas', -1);
    var imgPlacasDer = snapshotWallElevation('placas', 1);
    var imgEstructIzq = snapshotWallElevation('estructura', -1);
    var imgEstructDer = snapshotWallElevation('estructura', 1);
    var imgEstructCentral = snapshotView(defaultSpherical.theta, Math.PI/2.6, 1.1, function(e) { return e.category==='estructura' && e.state!==0 && isCentral(e); }, clipKeepCentral, 1.5);

    // --- Conclusion legible ---
    var totalPlacasCambio = countsPlacas['Cambio'] || 0;
    var totalPlacasVolteo = countsPlacas['Volteo'] || 0;
    var totalPlacasProx = countsPlacas['Proxima mantencion'] || 0;
    var totalEstructCambio = countsEstructura['Cambio'] || 0;
    var totalEstructProx = countsEstructura['Proximo a cambio'] || 0;
    var totalCambiosGeneral = totalPlacasCambio + totalPlacasVolteo + totalEstructCambio;

    var conclusion = 'Durante el turno ' + turnoTxt + ' se registraron ' + totalCambiosGeneral +
      ' intervenciones en el chute de alimentacion CV-201. En placas guia se realizaron ' +
      totalPlacasCambio + ' cambio(s) y ' + totalPlacasVolteo + ' volteo(s), quedando ' +
      totalPlacasProx + ' placa(s) marcada(s) para proxima mantencion. En la estructura se registraron ' +
      totalEstructCambio + ' cambio(s), con ' + totalEstructProx + ' elemento(s) marcado(s) para proximo cambio. ' +
      'Se recomienda dar seguimiento a los elementos marcados como proxima mantencion en la siguiente parada.';

    var doc = new jsPDFCtor({ unit: 'mm', format: 'a4' });
    var pageW = 210, pageH = 297;
    var margin = 14;
    var contentW = pageW - margin * 2;
    var y = 0;
    var pageNum = 1;

    function newPage() {
      doc.addPage();
      pageNum++;
      drawFooter();
      y = 24;
    }

    function drawFooter() {
      doc.setFontSize(7.5);
      doc.setTextColor(150, 150, 150);
      doc.text('Informe generado por plataforma de inspeccion Dimarza - BHP Escondida', margin, pageH - 8);
      doc.text('Pagina ' + pageNum, pageW - margin, pageH - 8, { align: 'right' });
      doc.setTextColor(0, 0, 0);
    }

    function ensureSpace(h) {
      if (y + h > pageH - 16) newPage();
    }

    function sectionHeader(title, color) {
      ensureSpace(10);
      doc.setFillColor.apply(doc, color || C_DARK);
      doc.rect(margin, y, 3, 5.5, 'F');
      doc.setFontSize(12);
      doc.setFont(undefined, 'bold');
      doc.setTextColor.apply(doc, C_DARK);
      doc.text(title, margin + 6, y + 4.3);
      y += 9;
      doc.setFontSize(9.5);
      doc.setFont(undefined, 'normal');
    }

    // ================= PORTADA =================
    doc.setFillColor.apply(doc, C_DARK);
    doc.rect(0, 0, pageW, 48, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(19);
    doc.setFont(undefined, 'bold');
    doc.text('Informe de inspeccion', margin, 22);
    doc.setFontSize(14);
    doc.setFont(undefined, 'normal');
    doc.text('Chute de alimentacion CV-201', margin, 31);
    doc.setFontSize(9.5);
    doc.text('Mineria Escondida - BHP  ·  Contratista Dimarza', margin, 39);
    doc.setTextColor(0, 0, 0);
    y = 58;

    doc.setFillColor.apply(doc, C_BG);
    doc.roundedRect(margin, y, contentW, 26, 2, 2, 'F');
    doc.setFontSize(9.5);
    doc.setFont(undefined, 'bold');
    doc.text('Turno', margin + 6, y + 8);
    doc.text('Fecha', margin + 6, y + 16);
    doc.text('G.A.P. placa guia - correa', margin + 90, y + 8);
    doc.setFont(undefined, 'normal');
    doc.text(turnoTxt, margin + 40, y + 8);
    doc.text(new Date().toLocaleString(), margin + 40, y + 16);
    doc.text(gapVal, margin + 150, y + 8);
    y += 36;

    sectionHeader('Resumen ejecutivo');
    var splitConclusion = doc.splitTextToSize(conclusion, contentW);
    doc.text(splitConclusion, margin, y);
    y += splitConclusion.length * 4.6 + 8;

    // --- Tarjetas de conteo (estilo KPI) ---
    function statCards(states, counts, startY) {
      var n = states.length;
      var gap = 4;
      var cardW = (contentW - gap * (n - 1)) / n;
      var cardH = 20;
      states.forEach(function(s, i) {
        var cx = margin + i * (cardW + gap);
        var color = s.name === 'Cambio' ? C_GREEN : s.name === 'Volteo' ? C_RED :
                    (s.name.indexOf('Proxima') === 0 || s.name.indexOf('Proximo') === 0) ? C_YELLOW :
                    C_STEEL;
        doc.setFillColor.apply(doc, C_BG);
        doc.roundedRect(cx, startY, cardW, cardH, 1.5, 1.5, 'F');
        doc.setFillColor.apply(doc, color);
        doc.roundedRect(cx, startY, 3, cardH, 1.5, 1.5, 'F');
        doc.setFontSize(13);
        doc.setFont(undefined, 'bold');
        doc.setTextColor.apply(doc, C_DARK);
        doc.text(String(counts[s.name] || 0), cx + 8, startY + 10);
        doc.setFontSize(7);
        doc.setFont(undefined, 'normal');
        var lbl = doc.splitTextToSize(s.name, cardW - 8);
        doc.text(lbl, cx + 8, startY + 15);
      });
      doc.setTextColor(0, 0, 0);
      return startY + cardH + 10;
    }

    ensureSpace(40);
    sectionHeader('Conteo general - Placas guia');
    y = statCards(CATEGORIES.placas.states, countsPlacas, y);

    ensureSpace(40);
    sectionHeader('Conteo general - Estructura');
    y = statCards(CATEGORIES.estructura.states, countsEstructura, y);

    // ================= FOTOS: PLACAS GUIA =================
    function photoWithStats(title, img, states, counts) {
      var maxW = contentW;
      var maxH = 105;
      var h = maxW / img.aspect;
      var w = maxW;
      if (h > maxH) { h = maxH; w = h * img.aspect; }
      ensureSpace(h + 26);
      doc.setFontSize(10.5);
      doc.setFont(undefined, 'bold');
      doc.setTextColor.apply(doc, C_DARK);
      doc.text(title, margin, y);
      y += 4;
      if (img.dataUrl) {
        doc.setDrawColor.apply(doc, C_LINE);
        doc.setFillColor(255, 255, 255);
        doc.roundedRect(margin, y, w, h, 1, 1, 'FD');
        doc.addImage(img.dataUrl, 'PNG', margin, y, w, h);
      }
      y += h + 4;
      var line = states.map(function(s) { return s.name + ': ' + (counts[s.name] || 0); }).join('    |    ');
      doc.setFontSize(8.5);
      doc.setFont(undefined, 'normal');
      doc.setTextColor(90, 90, 90);
      doc.text(line, margin, y);
      doc.setTextColor(0, 0, 0);
      y += 10;
    }

    newPage();
    sectionHeader('Placas guia cambiadas (vista de corte, segun sentido de carga)');
    photoWithStats('Pared izquierda', imgPlacasIzq, CATEGORIES.placas.states, countsPlacasIzq);
    photoWithStats('Pared derecha', imgPlacasDer, CATEGORIES.placas.states, countsPlacasDer);

    // ================= FOTOS: ESTRUCTURA =================
    newPage();
    sectionHeader('Estructura cambiada (vista de corte, segun sentido de carga)');
    photoWithStats('Pared izquierda', imgEstructIzq, CATEGORIES.estructura.states, countsEstructIzq);
    photoWithStats('Pared derecha', imgEstructDer, CATEGORIES.estructura.states, countsEstructDer);
    photoWithStats('Zona central (vista isometrica)', imgEstructCentral, CATEGORIES.estructura.states, countsEstructCentral);

    // ================= DETALLE =================
    function detailList(catKey, catDef) {
      var items = Object.keys(meshStates)
        .map(function(k) { return meshStates[k]; })
        .filter(function(e) { return e.category === catKey && e.state !== 0; });
      if (items.length === 0) return;
      ensureSpace(12);
      sectionHeader('Detalle de cambios - ' + catDef.label);
      items.forEach(function(e) {
        ensureSpace(5);
        var color = catDef.states[e.state].name === 'Cambio' ? C_GREEN :
                    catDef.states[e.state].name === 'Volteo' ? C_RED : C_YELLOW;
        doc.setFillColor.apply(doc, color);
        doc.circle(margin + 1.2, y - 1.3, 1.2, 'F');
        doc.setFontSize(9);
        doc.text(e.label + '   ->   ' + catDef.states[e.state].name, margin + 6, y);
        y += 5;
      });
      y += 4;
    }

    newPage();
    sectionHeader('Detalle completo de cambios');
    detailList('placas', CATEGORIES.placas);
    detailList('estructura', CATEGORIES.estructura);

    drawFooter();
    doc.save('informe_chute_cv201_' + Date.now() + '.pdf');
    statusEl.textContent = 'Informe generado.';
  }

  document.getElementById('btn-reset').addEventListener('click', function() {
    spherical.theta = defaultSpherical.theta;
    spherical.phi = defaultSpherical.phi;
    spherical.radius = defaultSpherical.radius;
    updateCameraFromSpherical();
  });
}
</script>
</body>
